version: "0.2"
name: shipwrights
summary: >
  An engineering team built on OpenRig's Workshop: a lead who turns your goal into
  missions and slices and decides the hard calls, a peer on either runtime that watches the
  lead and relaunches it if it goes down, a clerk that takes your goals and does the lead's
  routine coordination, a planner, a backend builder and a frontend builder, a QA seat for
  each builder, two code reviewers who review each slice as a pair on different runtimes, a
  judge that judges each slice's proof and passes the hard or risky ones to the lead, and a
  release manager who publishes and keeps each pull request mergeable. Enough for two
  streams of work; a rig grows the roles it needs. Launch it with --cwd in a clone of your
  repository, or in a folder that holds several clones.

culture_file: CULTURE.md

docs:
  - path: README.md

# Start steps shared by every seat; each seat's role file comes from its profile.
startup:
  files:
    - path: startup/context.md
      delivery_hint: send_text
      required: true
    # The team's roles, how many seats each has, and how to find them.
    - path: startup/team-shape.md
      delivery_hint: send_text
      required: true
    # The team settings. Replace this file to change a setting; every seat reads it at
    # start and at refocus.
    - path: settings.md
      delivery_hint: send_text
      required: true
  # Each seat proves it received its start steps and can reach OpenRig.
  # `rig ps --nodes` shows ORIENTED: verified, or missing until it does.
  actions:
    - type: startup_proof
      value: authenticated
      idempotent: true

# OpenRig writes its instruction blocks into each seat's working directory. Claude Code
# seats get them in CLAUDE.local.md, so they stay out of a project's own CLAUDE.md. Codex
# seats always use AGENTS.md. The README says how to keep both out of your pull requests.
managed_blocks:
  claude-code: CLAUDE.local.md

# Every seat launches with permission prompts off. The README's "Permissions" section says
# what that means and how to go back to OpenRig's default posture.
permission_policy: builtin:yolo
non_interruptive: true

# Pods group seats by role. A role that can grow numbers its seats: a grown seat takes the next number in its role's
# pod, the same profile for its runtime and start files, and a delegates_to edge from orch.lead (see the edges at the
# end), with a runtime in configurations.yaml. startup/team-shape.md says which roles can grow, and how far each can
# shrink.
pods:
  - id: orch
    label: Orchestration
    summary: Turns your goal into missions and slices and decides the hard calls. The peer relaunches the lead if it goes down, the clerk assigns seats and relaunches them, and the planner cuts the work.
    members:
      - id: lead
        agent_ref: "local:agents/shipwrights"
        profile: lead-codex
        runtime: codex
        cwd: "."
        startup:
          files:
            - path: startup/lead-first-move.md
              delivery_hint: send_text
              required: true
            - path: startup/review-pair-lead.md
              delivery_hint: send_text
              required: true
            - path: startup/slice-spec.md
              delivery_hint: send_text
              required: true
      # The lead's watchdog, on either runtime. It relaunches a down lead and never drives, so it gets none of the
      # lead's start files.
      - id: peer
        agent_ref: "local:agents/shipwrights"
        profile: peer-claude
        runtime: claude-code
        cwd: "."
      # Does the lead's routine coordination by fixed rules: takes the person's goals, routes work to planners, assigns
      # each locked slice its seats, relaunches freed seats, keeps the roster, checks the slice time limit and records
      # deliveries.
      - id: clerk-1
        agent_ref: "local:agents/shipwrights"
        profile: clerk-claude
        runtime: claude-code
        cwd: "."
      # Cuts goals and issues into missions and slices with specs, dependencies and a build order.
      - id: planner-1
        agent_ref: "local:agents/shipwrights"
        profile: planner-claude
        runtime: claude-code
        cwd: "."
        startup:
          files:
            - path: startup/slice-spec.md
              delivery_hint: send_text
              required: true
    edges:
      - kind: can_observe
        from: peer
        to: lead

  - id: dev
    label: Development
    summary: Builds each slice in its own worktree.
    members:
      - id: backend-1
        agent_ref: "local:agents/shipwrights"
        profile: builder-backend-claude
        runtime: claude-code
        cwd: "."
        startup:
          files:
            - path: startup/review-pair-builder.md
              delivery_hint: send_text
              required: true
      # Takes slices tagged UI or both.
      - id: frontend-1
        agent_ref: "local:agents/shipwrights"
        profile: builder-frontend-claude
        runtime: claude-code
        cwd: "."
        startup:
          files:
            - path: startup/review-pair-builder.md
              delivery_hint: send_text
              required: true
    edges: []

  - id: quality
    label: Quality
    summary: Runs the checks each slice calls for at each commit, before the reviewers see it.
    members:
      - id: qa-1
        agent_ref: "local:agents/shipwrights"
        profile: qa-claude
        runtime: claude-code
        cwd: "."
      - id: qa-2
        agent_ref: "local:agents/shipwrights"
        profile: qa-claude
        runtime: claude-code
        cwd: "."
    edges: []

  # The clerk pairs two reviewers on different runtimes for each slice; they review the same commit independently, and
  # the judge compares their findings and judges the slice.
  - id: review
    label: Review
    summary: Two reviewers on different runtimes check each slice's commit independently; the judge compares their findings and judges each slice's proof.
    members:
      - id: reviewer-1
        agent_ref: "local:agents/shipwrights"
        profile: code-reviewer-claude
        runtime: claude-code
        cwd: "."
        startup:
          files:
            - path: startup/review-pair-reviewer.md
              delivery_hint: send_text
              required: true
      - id: reviewer-2
        agent_ref: "local:agents/shipwrights"
        profile: code-reviewer-codex
        runtime: codex
        cwd: "."
        startup:
          files:
            - path: startup/review-pair-reviewer.md
              delivery_hint: send_text
              required: true
      # Judges each slice's proof against its locked spec, and passes the hard or risky ones to the lead.
      - id: judge-1
        agent_ref: "local:agents/shipwrights"
        profile: judge-claude
        runtime: claude-code
        cwd: "."
        startup:
          files:
            - path: startup/review-pair-judge.md
              delivery_hint: send_text
              required: true
            - path: startup/slice-spec.md
              delivery_hint: send_text
              required: true
    edges: []

  - id: release
    label: Release
    summary: Publishes each judged slice's pull request, watches CI and keeps it mergeable until it is merged.
    members:
      - id: manager-1
        agent_ref: "local:agents/shipwrights"
        profile: release-manager-codex
        runtime: codex
        cwd: "."
    edges: []

# OpenRig makes the source of a seat's delegates_to edge its orchestrator: the seat its stuck or unclaimed queue rows
# escalate to, taking the latest-launched source when there are several. So the lead is the only delegates_to source,
# and every seat reports back to it. The clerk and the judge act through queue rows, not edges: the clerk pairs
# builders, QA seats and reviewers afresh for each slice, so no edges join them.
edges:
  - kind: delegates_to
    from: orch.lead
    to: orch.clerk-1
  - kind: delegates_to
    from: orch.lead
    to: orch.planner-1
  - kind: delegates_to
    from: orch.lead
    to: dev.backend-1
  - kind: delegates_to
    from: orch.lead
    to: dev.frontend-1
  - kind: delegates_to
    from: orch.lead
    to: quality.qa-1
  - kind: delegates_to
    from: orch.lead
    to: quality.qa-2
  - kind: delegates_to
    from: orch.lead
    to: review.reviewer-1
  - kind: delegates_to
    from: orch.lead
    to: review.reviewer-2
  - kind: delegates_to
    from: orch.lead
    to: review.judge-1
  - kind: delegates_to
    from: orch.lead
    to: release.manager-1
