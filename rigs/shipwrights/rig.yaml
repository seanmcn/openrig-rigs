version: "0.2"
name: shipwrights
summary: >
  An engineering team built on OpenRig's Workshop: a lead who turns your goal into
  missions and slices and judges the proof, a peer on the other runtime who takes over
  if the lead goes down, a planner, two backend builders and a frontend builder, a QA seat
  for each builder, four code reviewers who review each slice in pairs on different runtimes,
  and a release manager who publishes and keeps each pull request mergeable. Launch it with --cwd in a clone of your
  repository, or in a folder that holds several clones.

culture_file: CULTURE.md

docs:
  - path: README.md

# Start steps shared by every seat; each seat's role file comes from its profile.
startup:
  files:
    - path: startup/context.md
      delivery_hint: send_text
      required: true
    # The team's roles, how many seats each has, and how to find them.
    - path: startup/team-shape.md
      delivery_hint: send_text
      required: true
    # The team settings. Replace this file to change a setting; every seat reads it at
    # start and at refocus.
    - path: settings.md
      delivery_hint: send_text
      required: true
  # Each seat proves it received its start steps and can reach OpenRig.
  # `rig ps --nodes` shows ORIENTED: verified, or missing until it does.
  actions:
    - type: startup_proof
      value: authenticated
      idempotent: true

# OpenRig writes its instruction blocks into each seat's working directory. Claude Code
# seats get them in CLAUDE.local.md, so they stay out of a project's own CLAUDE.md. Codex
# seats always use AGENTS.md. The README says how to keep both out of your pull requests.
managed_blocks:
  claude-code: CLAUDE.local.md

# Every seat launches with permission prompts off. The README's "Permissions" section says
# what that means and how to go back to OpenRig's default posture.
permission_policy: builtin:yolo
non_interruptive: true

# startup/team-shape.md lists the roles and says what a new seat needs: a member in its role's pod, a delegates_to
# edge from orch.lead (see the edges at the end), and a runtime in configurations.yaml.
pods:
  - id: orch
    label: Orchestration
    summary: Turns your goal into missions and slices, assigns them and judges their proof. The peer takes over if the lead goes down.
    members:
      - id: lead
        agent_ref: "local:agents/shipwrights"
        profile: lead
        runtime: codex
        cwd: "."
        startup:
          files:
            - path: startup/lead-first-move.md
              delivery_hint: send_text
              required: true
            - path: startup/review-pair-lead.md
              delivery_hint: send_text
              required: true
            - path: startup/slice-spec.md
              delivery_hint: send_text
              required: true
      # The lead's guidance on the other runtime. It drives only while the lead is down.
      - id: peer
        agent_ref: "local:agents/shipwrights"
        profile: peer
        runtime: claude-code
        cwd: "."
        startup:
          files:
            - path: startup/lead-first-move.md
              delivery_hint: send_text
              required: true
            - path: startup/review-pair-lead.md
              delivery_hint: send_text
              required: true
            - path: startup/slice-spec.md
              delivery_hint: send_text
              required: true
    edges:
      - kind: can_observe
        from: peer
        to: lead

  - id: plan
    label: Planning
    summary: Cuts goals and issues into missions and slices with specs, dependencies and a build order.
    members:
      - id: planner
        agent_ref: "local:agents/shipwrights"
        profile: planner
        runtime: claude-code
        cwd: "."
        startup:
          files:
            - path: startup/slice-spec.md
              delivery_hint: send_text
              required: true
    edges: []

  - id: dev
    label: Development
    summary: Builds each slice in its own worktree, and QA runs the checks each slice calls for.
    members:
      - id: backend
        agent_ref: "local:agents/shipwrights"
        profile: builder-backend
        runtime: claude-code
        cwd: "."
        startup:
          files:
            - path: startup/review-pair-builder.md
              delivery_hint: send_text
              required: true
      - id: backend2
        agent_ref: "local:agents/shipwrights"
        profile: builder-backend
        runtime: claude-code
        cwd: "."
        startup:
          files:
            - path: startup/review-pair-builder.md
              delivery_hint: send_text
              required: true
      # Takes slices tagged UI or both.
      - id: frontend
        agent_ref: "local:agents/shipwrights"
        profile: builder-frontend
        runtime: claude-code
        cwd: "."
        startup:
          files:
            - path: startup/review-pair-builder.md
              delivery_hint: send_text
              required: true
      - id: qa
        agent_ref: "local:agents/shipwrights"
        profile: qa
        runtime: claude-code
        cwd: "."
      - id: qa2
        agent_ref: "local:agents/shipwrights"
        profile: qa
        runtime: claude-code
        cwd: "."
      - id: qa3
        agent_ref: "local:agents/shipwrights"
        profile: qa
        runtime: claude-code
        cwd: "."
    edges: []

  # The lead pairs two reviewers on different runtimes for each slice; they review the same commit independently.
  - id: review
    label: Review
    summary: Two reviewers on different runtimes check each slice's commit independently; the lead compares their findings.
    members:
      - id: r1
        agent_ref: "local:agents/shipwrights"
        profile: code-reviewer
        runtime: claude-code
        cwd: "."
        startup:
          files:
            - path: startup/review-pair-reviewer.md
              delivery_hint: send_text
              required: true
      - id: r2
        agent_ref: "local:agents/shipwrights"
        profile: code-reviewer
        runtime: codex
        cwd: "."
        startup:
          files:
            - path: startup/review-pair-reviewer.md
              delivery_hint: send_text
              required: true
      - id: r3
        agent_ref: "local:agents/shipwrights"
        profile: code-reviewer
        runtime: claude-code
        cwd: "."
        startup:
          files:
            - path: startup/review-pair-reviewer.md
              delivery_hint: send_text
              required: true
      - id: r4
        agent_ref: "local:agents/shipwrights"
        profile: code-reviewer
        runtime: codex
        cwd: "."
        startup:
          files:
            - path: startup/review-pair-reviewer.md
              delivery_hint: send_text
              required: true
    edges: []

  - id: release
    label: Release
    summary: Publishes each judged slice's pull request, watches CI and keeps it mergeable until it is merged.
    members:
      - id: manager
        agent_ref: "local:agents/shipwrights"
        profile: release-manager
        runtime: codex
        cwd: "."
    edges: []

# OpenRig makes the source of a seat's delegates_to edge its orchestrator: the seat its stuck or unclaimed queue rows
# escalate to, taking the latest-launched source when there are several. So the lead is the only delegates_to source,
# and every seat reports back to it. The lead pairs builders, QA seats and reviewers afresh for each slice, so no
# edges join them.
edges:
  - kind: delegates_to
    from: orch.lead
    to: plan.planner
  - kind: delegates_to
    from: orch.lead
    to: dev.backend
  - kind: delegates_to
    from: orch.lead
    to: dev.backend2
  - kind: delegates_to
    from: orch.lead
    to: dev.frontend
  - kind: delegates_to
    from: orch.lead
    to: dev.qa
  - kind: delegates_to
    from: orch.lead
    to: dev.qa2
  - kind: delegates_to
    from: orch.lead
    to: dev.qa3
  - kind: delegates_to
    from: orch.lead
    to: review.r1
  - kind: delegates_to
    from: orch.lead
    to: review.r2
  - kind: delegates_to
    from: orch.lead
    to: review.r3
  - kind: delegates_to
    from: orch.lead
    to: review.r4
  - kind: delegates_to
    from: orch.lead
    to: release.manager
  - kind: can_observe
    from: orch.peer
    to: plan.planner
  - kind: can_observe
    from: orch.peer
    to: release.manager
