name: shipwrights
version: "2.3.0"
description: >
  A seat on the shipwrights rig, which works in a clone of a repository, or in a folder
  that holds several clones. The rig member's profile picks the role and the runtime: each of
  lead, peer, clerk, planner, builder-backend, builder-frontend, qa, code-reviewer, judge
  and release-manager has a profile for Claude Code and one for Codex, such as lead-claude and lead-codex. (An
  OpenRig profile selects resources and startup files; it is not a Codex permission profile.)

# Claude Code and Codex seats select OpenRig's own openrig-core plugin from the daemon's
# OpenRig home, so they get the OpenRig skills (and the plugin's hooks) that match the
# person's installed OpenRig.
#
# The team ships every other skill its guidance names: Workshop's using-the-tui-together in
# skills/, and a copy of each skill in ../../skills.md, unchanged from its source at the commit
# the table pins, in vendor/. scripts/sync-skills.py writes vendor/, the skill declarations
# below and each profile's skills from the table, so edit the table, never a copy or those
# lines. Each skill follows its source on restore, so a rig restored after an update gets the
# new copy rather than losing the skill.
#
# version is the team version, which a tag shipwrights-v<version> marks; the README's
# "Versions" section says when each part moves. Keep it quoted: the weekly update bumps it.

resources:
  skills:
    - { id: using-the-tui-together, path: skills/using-the-tui-together, on_restore: follow_source }
    - { id: ponytail, path: vendor/ponytail, on_restore: follow_source }
    - { id: ponytail-review, path: vendor/ponytail-review, on_restore: follow_source }
    - { id: pr, path: vendor/pr, on_restore: follow_source }
    - { id: retro, path: vendor/retro, on_restore: follow_source }
    - { id: triage, path: vendor/triage, on_restore: follow_source }
    - { id: wayfinder, path: vendor/wayfinder, on_restore: follow_source }
    - { id: implement, path: vendor/implement, on_restore: follow_source }
    - { id: tdd, path: vendor/tdd, on_restore: follow_source }
    - { id: diagnosing-bugs, path: vendor/diagnosing-bugs, on_restore: follow_source }
    - { id: code-review, path: vendor/code-review, on_restore: follow_source }
    - { id: differential-review, path: vendor/differential-review, on_restore: follow_source }
    - { id: sharp-edges, path: vendor/sharp-edges, on_restore: follow_source }
    - { id: supply-chain-risk-auditor, path: vendor/supply-chain-risk-auditor, on_restore: follow_source }
    - { id: agentic-actions-auditor, path: vendor/agentic-actions-auditor, on_restore: follow_source }
    - { id: impeccable, path: vendor/impeccable, on_restore: follow_source }
    - { id: grilling, path: vendor/grilling, on_restore: follow_source }
    - { id: domain-modeling, path: vendor/domain-modeling, on_restore: follow_source }
    - { id: research, path: vendor/research, on_restore: follow_source }
    - { id: writing-for-agents, path: vendor/writing-for-agents, on_restore: follow_source }
    - { id: to-spec, path: vendor/to-spec, on_restore: follow_source }
    - { id: codebase-design, path: vendor/codebase-design, on_restore: follow_source }
    - { id: wizard, path: vendor/wizard, on_restore: follow_source }
    - { id: prototype, path: vendor/prototype, on_restore: follow_source }
    - { id: humanizer, path: vendor/humanizer, on_restore: follow_source }
    - { id: diagram-design, path: vendor/diagram-design, on_restore: follow_source }
  plugins:
    # OpenRig's own plugin, as the daemon seeded it into its OpenRig home.
    - id: openrig-core
      source:
        kind: local
        path: "openrig-home:plugins/openrig-core"
  runtime_resources:
    # Turns on activity reporting for Claude Code seats. Codex seats skip it.
    - id: claude-activity-hooks
      path: runtime/claude-activity-hooks.json
      runtime: claude-code
      type: claude_activity_hooks

# Every profile selects using-the-tui-together and the skills whose row in ../../skills.md lists
# its role, in the table's order, and nothing installed at user level.
#
# Each role has one profile per runtime, <role>-claude and <role>-codex. The two deliver the
# same guidance files and select the same resources; they differ only in the runtime and in
# the model and effort the README's "Models" section suggests for the role on it. Change a
# role's guidance, skills or start files in both. ../../configurations.yaml gives each seat
# its role's profile for the runtime it runs on, and a rig may override any seat's model.
profiles:
  lead-claude:
    summary: Turns the person's goal into scoped slices, locks their specs and decides the hard or risky slices the judge passes it.
    preferences:
      runtime: claude-code
      model: claude-opus-5-5
      effort: high
    uses:
      skills: [using-the-tui-together, ponytail, retro, grilling, domain-modeling, research, writing-for-agents, humanizer, diagram-design]
      plugins: [openrig-core]
      runtime_resources: [claude-activity-hooks]
    startup:
      files:
        - path: guidance/lead.md
          delivery_hint: send_text
          required: true
      actions: []

  lead-codex:
    summary: Turns the person's goal into scoped slices, locks their specs and decides the hard or risky slices the judge passes it.
    preferences:
      runtime: codex
      model: gpt-6-astra
      effort: high
    uses:
      skills: [using-the-tui-together, ponytail, retro, grilling, domain-modeling, research, writing-for-agents, humanizer, diagram-design]
      plugins: [openrig-core]
      runtime_resources: [claude-activity-hooks]
    startup:
      files:
        - path: guidance/lead.md
          delivery_hint: send_text
          required: true
      actions: []

  peer-claude:
    summary: The lead's watchdog. Watches the lead, restores it after a handover, relaunches it when it is down and never drives.
    preferences:
      runtime: claude-code
      model: claude-haiku-5-5
      effort: low
    uses:
      skills: [using-the-tui-together, ponytail]
      plugins: [openrig-core]
      runtime_resources: [claude-activity-hooks]
    startup:
      files:
        - path: guidance/peer.md
          delivery_hint: send_text
          required: true
      actions: []

  peer-codex:
    summary: The lead's watchdog. Watches the lead, restores it after a handover, relaunches it when it is down and never drives.
    preferences:
