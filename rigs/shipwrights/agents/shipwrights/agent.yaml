name: shipwrights
version: "1.0"
description: >
  A seat on the shipwrights rig, which works in a clone of a repository, or in a folder
  that holds several clones. The rig member's profile picks the role and the runtime: each of
  lead, peer, planner, builder-backend, builder-frontend, qa, code-reviewer and release-manager
  has a profile for Claude Code and one for Codex, such as lead-claude and lead-codex. (An
  OpenRig profile selects resources and startup files; it is not a Codex permission profile.)

# Claude Code and Codex seats select OpenRig's own openrig-core plugin from the daemon's
# OpenRig home, so they get the OpenRig skills (and the plugin's hooks) that match the
# person's installed OpenRig. The only skill the team ships is Workshop's
# using-the-tui-together.
#
# The other skills the guidance names are not shipped: the person installs them at user
# level (~/.claude/skills and ~/.codex/skills), where every seat finds them, or supplies
# their own under the same names. ../../skills.md lists them, and ../../install-skills.sh
# installs them.

resources:
  skills:
    - { id: using-the-tui-together, path: skills/using-the-tui-together }
  plugins:
    # OpenRig's own plugin, as the daemon seeded it into its OpenRig home.
    - id: openrig-core
      source:
        kind: local
        path: "openrig-home:plugins/openrig-core"
  runtime_resources:
    # Turns on activity reporting for Claude Code seats. Codex seats skip it.
    - id: claude-activity-hooks
      path: runtime/claude-activity-hooks.json
      runtime: claude-code
      type: claude_activity_hooks

# Every profile selects only what OpenRig provides. The skills each seat uses beyond these
# are installed at user level; ../../skills.md says which seat uses which.
#
# Each role has one profile per runtime, <role>-claude and <role>-codex. The two deliver the
# same guidance files and select the same resources; they differ only in the runtime and in
# the model and effort the README's "Models" section suggests for the role on it. Change a
# role's guidance, skills or start files in both. ../../configurations.yaml gives each seat
# its role's profile for the runtime it runs on, and a rig may override any seat's model.
profiles:
  lead-claude:
    summary: Turns the person's goal into scoped slices, assigns them, judges their proof and keeps the PR description true.
    preferences:
      runtime: claude-code
      model: claude-opus-5-5
      effort: high
    uses:
      skills: [using-the-tui-together]
      plugins: [openrig-core]
      runtime_resources: [claude-activity-hooks]
    startup:
      files:
        - path: guidance/lead.md
          delivery_hint: send_text
          required: true
      actions: []

  lead-codex:
    summary: Turns the person's goal into scoped slices, assigns them, judges their proof and keeps the PR description true.
    preferences:
      runtime: codex
      model: gpt-6-astra
      effort: high
    uses:
      skills: [using-the-tui-together]
      plugins: [openrig-core]
      runtime_resources: [claude-activity-hooks]
    startup:
      files:
        - path: guidance/lead.md
          delivery_hint: send_text
          required: true
      actions: []

  peer-claude:
    summary: The lead's watchdog. Watches the lead, restores it after a handover, relaunches it when it is down and never drives.
    preferences:
      runtime: claude-code
      model: claude-haiku-5-5
      effort: low
    uses:
      skills: [using-the-tui-together]
      plugins: [openrig-core]
      runtime_resources: [claude-activity-hooks]
    startup:
      files:
        - path: guidance/lead.md
          delivery_hint: send_text
          required: true
        - path: guidance/peer.md
          delivery_hint: send_text
          required: true
      actions: []

  peer-codex:
    summary: The lead's watchdog. Watches the lead, restores it after a handover, relaunches it when it is down and never drives.
    preferences:
      runtime: codex
      model: gpt-6-luna
      effort: low
    uses:
      skills: [using-the-tui-together]
      plugins: [openrig-core]
      runtime_resources: [claude-activity-hooks]
    startup:
      files:
        - path: guidance/lead.md
          delivery_hint: send_text
