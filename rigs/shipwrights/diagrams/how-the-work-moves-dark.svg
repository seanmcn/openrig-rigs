<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1056 1048" width="1056" height="1048" role="img" aria-labelledby="how-the-work-moves-dark-title how-the-work-moves-dark-desc">
  <title id="how-the-work-moves-dark-title">How the work moves</title>
  <desc id="how-the-work-moves-dark-desc">The clerk takes your goal and routes it to a planner, which cuts it; the lead takes the work on by locking each slice's spec, and the clerk assigns it a builder and a QA seat; the judge judges the proof once it is built and reviewed, passing the hard or risky slices to the lead to decide, and hands it to the release manager, which writes the description and opens the pull requests; a failing CI run or a conflict goes back through the lead, which decides the fix, to the clerk to assign; you merge, the release manager approves delivery, the clerk records it, and the lead closes your goal once its mission is complete.</desc>
