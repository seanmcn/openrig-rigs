<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 492" width="980" height="492" role="img" aria-labelledby="seats-title seats-desc">
  <title id="seats-title">Shipwrights' seats</title>
  <desc id="seats-desc">The lead is the hub: it hands your goal to the planner, which sends back slices; it hands each locked slice to a builder, which hands each commit to QA and then the reviewers, and the builders, QA and reviewers report back to it; it hands judged slices to the release manager, which reports the pull request and its delivery. Reviewers' findings go straight to the builders.</desc>
