<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-labelledby="seats-title seats-desc">
  <title id="seats-title">Shipwrights' seats</title>
  <desc id="seats-desc">Shipwrights' ten seats in five pods: in orch, the lead, its peer and a planner; in dev, a backend builder and a frontend builder; in quality, two QA seats; in review, two code reviewers, one on each runtime; and in release, a release manager. A role that can grow numbers its seats.</desc>
