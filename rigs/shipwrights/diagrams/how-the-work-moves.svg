<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1128" width="880" height="1128" role="img" aria-labelledby="how-the-work-moves-title how-the-work-moves-desc">
  <title id="how-the-work-moves-title">How the work moves</title>
  <desc id="how-the-work-moves-desc">The lead takes on your goal and the clerk routes it to a planner, which cuts it; the lead locks each slice's spec and the clerk assigns it a builder and a QA seat; the lead judges the proof once it is built and reviewed, and hands it to the release manager, which opens the pull requests; a failing CI run or a conflict goes back through the lead, which decides the fix, to the clerk to assign; you merge, the release manager approves delivery, the clerk records it, and the lead closes your goal once its mission is complete.</desc>
