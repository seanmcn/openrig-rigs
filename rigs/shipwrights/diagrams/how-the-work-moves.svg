<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 672" width="880" height="672" role="img" aria-labelledby="how-the-work-moves-title how-the-work-moves-desc">
  <title id="how-the-work-moves-title">How the work moves</title>
  <desc id="how-the-work-moves-desc">A slice goes from your goal through the lead, a builder, QA and two reviewers, the lead's judgement and the release manager, to your merge and its delivery; reviewers' findings go back to the builder.</desc>
  <defs><marker id="how-the-work-moves-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4f5d75"/></marker><marker id="how-the-work-moves-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#bf4520"/></marker></defs>
  <line x1="176" y1="12" x2="176" y2="624" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <line x1="352" y1="12" x2="352" y2="624" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <line x1="528" y1="12" x2="528" y2="624" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <line x1="704" y1="12" x2="704" y2="624" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <line x1="0" y1="40" x2="880" y2="40" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <path d="M160,80 L256,80 Q264,80 264,88 L264,128" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#how-the-work-moves-arrow-muted)"/>
  <path d="M336,152 L432,152 Q440,152 440,160 L440,200" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#how-the-work-moves-arrow-muted)"/>
  <path d="M512,224 L608,224 Q616,224 616,232 L616,272" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#how-the-work-moves-arrow-muted)"/>
  <path d="M544,296 L272,296 Q264,296 264,304 L264,344" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#how-the-work-moves-arrow-muted)"/>
  <path d="M336,368 L784,368 Q792,368 792,376 L792,416" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#how-the-work-moves-arrow-muted)"/>
  <path d="M720,440 L96,440 Q88,440 88,448 L88,488" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#how-the-work-moves-arrow-accent)"/>
  <path d="M160,512 L784,512 Q792,512 792,520 L792,560" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#how-the-work-moves-arrow-muted)"/>
  <path d="M584,272 L584,248 Q584,240 576,240 L512,240" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#how-the-work-moves-arrow-muted)"/>
  <text x="88" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle" letter-spacing="1">YOU</text>
  <text x="264" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle" letter-spacing="1">LEAD &amp; PLANNER</text>
  <text x="440" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle" letter-spacing="1">BUILDER</text>
  <text x="616" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle" letter-spacing="1">QA &amp; REVIEWERS</text>
  <text x="792" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle" letter-spacing="1">RELEASE MANAGER</text>
  <rect x="16" y="56" width="144" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1.2"/>
  <text x="88" y="77" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Your goal</text>
  <text x="88" y="93" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">an issue or a request</text>
  <rect x="192" y="128" width="144" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1.2"/>
  <text x="264" y="149" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Cut and lock</text>
  <text x="264" y="165" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">mission, slices, specs</text>
  <rect x="368" y="200" width="144" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1.2"/>
  <text x="440" y="221" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Build</text>
  <text x="440" y="237" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">commit in a worktree</text>
  <rect x="544" y="272" width="144" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1.2"/>
  <text x="616" y="293" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Record proof</text>
  <text x="616" y="309" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">QA, r1, r2 at once</text>
  <rect x="192" y="344" width="144" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1.2"/>
  <text x="264" y="365" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Judge proof</text>
  <text x="264" y="381" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">at that commit</text>
  <rect x="720" y="416" width="144" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1.2"/>
  <text x="792" y="437" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Open pull requests</text>
  <text x="792" y="453" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">with the merge gate</text>
  <rect x="16" y="488" width="144" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.6"/>
  <text x="88" y="509" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#bf4520" text-anchor="middle">Merge</text>
  <text x="88" y="525" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">your decision</text>
  <rect x="720" y="560" width="144" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1.2"/>
  <text x="792" y="581" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Approve delivery</text>
  <text x="792" y="597" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">the slice is done</text>
  <text x="548" y="258" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle" letter-spacing="0.6">FINDINGS</text>
  <rect x="0" y="643" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="22" y="652" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#5a6580">your step</text>
  <line x1="105.80000000000001" y1="648" x2="121.80000000000001" y2="648" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="127.80000000000001" y="652" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#5a6580">back to an earlier step</text>
</svg>
