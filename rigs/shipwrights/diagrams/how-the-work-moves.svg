  <path d="M512,320 L608,320 Q616,320 616,328 L616,376" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#how-the-work-moves-arrow-muted)"/>
  <path d="M544,400 L272,400 Q264,400 264,408 L264,456" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#how-the-work-moves-arrow-muted)"/>
  <path d="M336,480 L784,480 Q792,480 792,488 L792,536" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#how-the-work-moves-arrow-muted)"/>
