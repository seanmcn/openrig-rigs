<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 808" width="880" height="808" role="img" aria-labelledby="how-the-work-moves-title how-the-work-moves-desc">
  <title id="how-the-work-moves-title">How the work moves</title>
  <desc id="how-the-work-moves-desc">A slice goes from your goal through the lead, a builder and QA until QA passes, then two reviewers, the lead's judgement and the release manager, to your merge and its delivery; reviewers' findings go back to the builder and through QA again.</desc>
