  <path d="M640,376 L640,248 Q640,240 632,240 L512,240" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#how-the-work-moves-arrow-muted)"/>
  <text x="88" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle" letter-spacing="1">YOU</text>
  <text x="264" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle" letter-spacing="1">LEAD &amp; PLANNER</text>
  <text x="440" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle" letter-spacing="1">BUILDER &amp; QA</text>
  <text x="616" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle" letter-spacing="1">REVIEWERS</text>
  <text x="792" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle" letter-spacing="1">RELEASE MANAGER</text>
