<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" width="760" height="416" role="img" aria-labelledby="seat-start-dark-title seat-start-dark-desc">
  <title id="seat-start-dark-title">What a seat starts with</title>
  <desc id="seat-start-dark-desc">Every seat starts with the team's culture, start steps, settings and skills, then its profile's role guidance and its own start files; an overlay replaces the settings, swaps skills and adds start files.</desc>
