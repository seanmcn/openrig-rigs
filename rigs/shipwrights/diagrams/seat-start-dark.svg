  <rect x="136" y="48" width="432" height="336" rx="6" fill="none" stroke="#bfc0c0" stroke-width="1"/>
  <line x1="136" y1="104" x2="568" y2="104" stroke="rgba(245,245,245,0.16)" stroke-width="1"/>
  <line x1="136" y1="160" x2="568" y2="160" stroke="rgba(245,245,245,0.16)" stroke-width="1"/>
  <line x1="136" y1="216" x2="568" y2="216" stroke="rgba(245,245,245,0.16)" stroke-width="1"/>
  <line x1="136" y1="272" x2="568" y2="272" stroke="rgba(245,245,245,0.16)" stroke-width="1"/>
  <line x1="136" y1="328" x2="568" y2="328" stroke="rgba(245,245,245,0.16)" stroke-width="1"/>
  <line x1="120" y1="56" x2="120" y2="264" stroke="#bfc0c0" stroke-width="1"/>
  <line x1="120" y1="56" x2="126" y2="56" stroke="#bfc0c0" stroke-width="1"/>
  <line x1="120" y1="264" x2="126" y2="264" stroke="#bfc0c0" stroke-width="1"/>
  <line x1="120" y1="280" x2="120" y2="320" stroke="#bfc0c0" stroke-width="1"/>
  <line x1="120" y1="280" x2="126" y2="280" stroke="#bfc0c0" stroke-width="1"/>
  <line x1="120" y1="320" x2="126" y2="320" stroke="#bfc0c0" stroke-width="1"/>
  <line x1="120" y1="336" x2="120" y2="376" stroke="#bfc0c0" stroke-width="1"/>
  <line x1="120" y1="336" x2="126" y2="336" stroke="#bfc0c0" stroke-width="1"/>
  <line x1="120" y1="376" x2="126" y2="376" stroke="#bfc0c0" stroke-width="1"/>
  <path d="M28,56 L28,376" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#seat-start-dark-arrow-muted)"/>
  <text x="24" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="start" letter-spacing="1">SCOPE</text>
  <text x="156" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="start" letter-spacing="1">LAYER</text>
  <text x="548" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="end" letter-spacing="1">FROM</text>
  <text x="592" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="start" letter-spacing="1">IN AN OVERLAY</text>
  <text x="156" y="80.5" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="start">Culture</text>
  <text x="548" y="80" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="end">CULTURE.md</text>
  <text x="156" y="136.5" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="start">Start steps</text>
  <text x="548" y="136" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="end">context.md, team-shape.md</text>
  <text x="156" y="192.5" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="start">Settings</text>
  <text x="548" y="192" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="end">settings.md</text>
  <text x="592" y="191" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="start" letter-spacing="0.6">YOUR COPY</text>
  <text x="156" y="248.5" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="start">Skills</text>
  <text x="548" y="248" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="end">openrig-core, user-level</text>
  <text x="592" y="247" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="start" letter-spacing="0.6">SWAP ANY FOR YOURS</text>
  <text x="156" y="304.5" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="start">Role guidance</text>
  <text x="548" y="304" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="end">guidance/&lt;role&gt;.md</text>
  <text x="592" y="303" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="start" letter-spacing="0.6">KEEP AS IT IS</text>
  <text x="156" y="360.5" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="start">Its own start files</text>
  <text x="548" y="360" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="end">startup/review-pair-*.md</text>
  <text x="592" y="359" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="start" letter-spacing="0.6">ADD YOUR OWN RULES</text>
  <text x="112" y="163" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="end" letter-spacing="0.6">EVERY SEAT</text>
  <text x="112" y="303" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="end" letter-spacing="0.6">PER PROFILE</text>
  <text x="112" y="359" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="end" letter-spacing="0.6">PER SEAT</text>
  <text x="24" y="404" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="start" letter-spacing="0.6">NARROWER</text>
</svg>
