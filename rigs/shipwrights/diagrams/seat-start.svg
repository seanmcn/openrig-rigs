<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" width="760" height="416" role="img" aria-labelledby="seat-start-title seat-start-desc">
  <title id="seat-start-title">What a seat starts with</title>
  <desc id="seat-start-desc">Every seat starts with the team's culture, start steps and settings, then its profile's skills and role guidance and its own start files; an overlay replaces the settings, swaps skills and adds start files.</desc>
