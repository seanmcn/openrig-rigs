  <rect x="136" y="48" width="432" height="336" rx="6" fill="none" stroke="#4f5d75" stroke-width="1"/>
  <line x1="136" y1="104" x2="568" y2="104" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <line x1="136" y1="160" x2="568" y2="160" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <line x1="136" y1="216" x2="568" y2="216" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <line x1="136" y1="272" x2="568" y2="272" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <line x1="136" y1="328" x2="568" y2="328" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <line x1="120" y1="56" x2="120" y2="208" stroke="#4f5d75" stroke-width="1"/>
  <line x1="120" y1="56" x2="126" y2="56" stroke="#4f5d75" stroke-width="1"/>
  <line x1="120" y1="208" x2="126" y2="208" stroke="#4f5d75" stroke-width="1"/>
  <line x1="120" y1="224" x2="120" y2="320" stroke="#4f5d75" stroke-width="1"/>
  <line x1="120" y1="224" x2="126" y2="224" stroke="#4f5d75" stroke-width="1"/>
  <line x1="120" y1="320" x2="126" y2="320" stroke="#4f5d75" stroke-width="1"/>
  <line x1="120" y1="336" x2="120" y2="376" stroke="#4f5d75" stroke-width="1"/>
  <line x1="120" y1="336" x2="126" y2="336" stroke="#4f5d75" stroke-width="1"/>
