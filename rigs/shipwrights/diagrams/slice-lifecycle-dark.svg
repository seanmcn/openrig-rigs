  <path d="M800,104 L800,88 Q800,80 792,80 L672,80 Q664,80 664,88 L664,104" fill="none" stroke="#bfc0c0" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#slice-lifecycle-dark-arrow-muted)"/>
  <path d="M848,104 L848,48 Q848,40 840,40 L256,40 Q248,40 248,48 L248,104" fill="none" stroke="#bfc0c0" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#slice-lifecycle-dark-arrow-muted)"/>
  <line x1="24" y1="176" x2="816" y2="176" stroke="#bfc0c0" stroke-width="1"/>
  <line x1="24" y1="168" x2="24" y2="176" stroke="#bfc0c0" stroke-width="1"/>
