  <path d="M296,220 L296,176" fill="none" stroke="#bfc0c0" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#slice-lifecycle-dark-arrow-muted)"/>
  <path d="M120,176 L120,312" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#slice-lifecycle-dark-arrow-muted)"/>
  <path d="M856,152 L856,312" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#slice-lifecycle-dark-arrow-accent)"/>
  <text x="24" y="20" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="start" letter-spacing="1">PHASES</text>
  <rect x="24" y="104" width="128" height="48" rx="6" fill="rgba(255,255,255,0.05)" stroke="#f5f5f5" stroke-width="1.2"/>
  <text x="88" y="125" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="middle">Spec locked</text>
  <text x="88" y="141" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle">lead</text>
  <rect x="208" y="104" width="128" height="48" rx="6" fill="rgba(255,255,255,0.05)" stroke="#f5f5f5" stroke-width="1.2"/>
  <text x="272" y="125" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="middle">Building</text>
  <text x="272" y="141" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle">builder and QA</text>
  <rect x="392" y="104" width="128" height="48" rx="6" fill="rgba(255,255,255,0.05)" stroke="#f5f5f5" stroke-width="1.2"/>
  <text x="456" y="125" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="middle">In review</text>
  <text x="456" y="141" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle">r1 and r2</text>
  <rect x="576" y="104" width="128" height="48" rx="6" fill="rgba(255,255,255,0.05)" stroke="#f5f5f5" stroke-width="1.2"/>
  <text x="640" y="125" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="middle">Judged</text>
  <text x="640" y="141" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle">lead</text>
  <rect x="760" y="104" width="128" height="48" rx="6" fill="rgba(255,255,255,0.05)" stroke="#f5f5f5" stroke-width="1.2"/>
  <text x="824" y="125" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="middle">Published</text>
  <text x="824" y="141" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle">release manager</text>
  <text x="180" y="118" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="middle" letter-spacing="0.6">ASSIGN</text>
  <text x="364" y="118" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="middle" letter-spacing="0.6">QA PASS</text>
  <text x="548" y="118" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="middle" letter-spacing="0.6">PASS</text>
  <text x="732" y="118" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="middle" letter-spacing="0.6">PUSH</text>
  <text x="364" y="70" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="middle" letter-spacing="0.6">FINDINGS</text>
  <text x="732" y="70" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="middle" letter-spacing="0.6">REBASE</text>
  <text x="548" y="30" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="middle" letter-spacing="0.6">CI FAILS</text>
  <text x="456" y="168" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="middle" letter-spacing="0.6">FROM ANY PHASE</text>
  <text x="24" y="208" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="start" letter-spacing="1">HELD</text>
  <rect x="208" y="220" width="128" height="48" rx="6" fill="rgba(255,255,255,0.05)" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="272" y="241" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="middle">Paused</text>
  <text x="272" y="257" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle">rows blocked</text>
  <text x="240" y="202" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="end" letter-spacing="0.6">PAUSE</text>
  <text x="304" y="202" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="start" letter-spacing="0.6">RESUME</text>
  <text x="24" y="300" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="start" letter-spacing="1">OUTCOMES</text>
  <rect x="24" y="312" width="128" height="48" rx="6" fill="rgba(255,255,255,0.05)" stroke="#bfc0c0" stroke-width="1.2"/>
  <text x="88" y="333" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="middle">Stopped</text>
  <text x="88" y="349" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle">rows closed</text>
  <text x="128" y="202" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="start" letter-spacing="0.6">STOP</text>
  <rect x="760" y="312" width="128" height="48" rx="6" fill="rgba(240,138,89,0.12)" stroke="#f08a59" stroke-width="1.6"/>
  <text x="824" y="333" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f08a59" text-anchor="middle">Delivered</text>
  <text x="824" y="349" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle">delivery approved</text>
  <text x="848" y="248" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#f08a59" text-anchor="end" letter-spacing="0.6">YOU MERGE</text>
  <rect x="24" y="395" width="14" height="10" rx="2" fill="rgba(240,138,89,0.12)" stroke="#f08a59" stroke-width="1.4"/>
  <text x="46" y="404" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#949eb2">the outcome you want</text>
  <rect x="198.0" y="395" width="14" height="10" rx="2" fill="none" stroke="#bfc0c0" stroke-dasharray="3,2"/>
  <text x="220.0" y="404" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#949eb2">held, resumable</text>
  <line x1="341.0" y1="400" x2="357.0" y2="400" stroke="#bfc0c0" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="363.0" y="404" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#949eb2">back to an earlier phase</text>
</svg>
