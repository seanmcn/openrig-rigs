<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 424" width="920" height="424" role="img" aria-labelledby="slice-lifecycle-dark-title slice-lifecycle-dark-desc">
  <title id="slice-lifecycle-dark-title">A slice's lifecycle</title>
  <desc id="slice-lifecycle-dark-desc">A slice's spec is locked, then it is built and checked by QA until QA passes, reviewed, judged, and its pull requests published; findings, a failing CI run and a rebase loop back, it can be paused or stopped from any phase, and it is delivered once you merge.</desc>
  <defs><marker id="slice-lifecycle-dark-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#bfc0c0"/></marker><marker id="slice-lifecycle-dark-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f08a59"/></marker></defs>
  <path d="M152,128 L208,128" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#slice-lifecycle-dark-arrow-muted)"/>
  <path d="M336,128 L392,128" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#slice-lifecycle-dark-arrow-muted)"/>
  <path d="M520,128 L576,128" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#slice-lifecycle-dark-arrow-muted)"/>
