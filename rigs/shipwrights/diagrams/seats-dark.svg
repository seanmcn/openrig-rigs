  <title id="seats-dark-title">Shipwrights' seats</title>
  <desc id="seats-dark-desc">Shipwrights' eleven seats in five pods: in orch, the lead, its peer, a clerk and a planner; in dev, a backend builder and a frontend builder; in quality, two QA seats; in review, two code reviewers, one on each runtime; and in release, a release manager. A role that can grow numbers its seats.</desc>
