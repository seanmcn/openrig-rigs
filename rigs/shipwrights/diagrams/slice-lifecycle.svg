<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-labelledby="slice-lifecycle-title slice-lifecycle-desc">
  <title id="slice-lifecycle-title">A slice's lifecycle</title>
  <desc id="slice-lifecycle-desc">A slice's spec is locked, then it is built, its proof recorded and judged, and its pull requests published; findings and rebases loop back, it can be paused or stopped from any phase, and it is delivered once you merge.</desc>
  <defs><marker id="slice-lifecycle-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4f5d75"/></marker><marker id="slice-lifecycle-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#bf4520"/></marker></defs>
  <path d="M152,104 L208,104" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#slice-lifecycle-arrow-muted)"/>
  <path d="M336,104 L392,104" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#slice-lifecycle-arrow-muted)"/>
  <path d="M520,104 L576,104" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#slice-lifecycle-arrow-muted)"/>
  <path d="M704,104 L760,104" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#slice-lifecycle-arrow-muted)"/>
  <path d="M432,80 L432,64 Q432,56 424,56 L304,56 Q296,56 296,64 L296,80" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#slice-lifecycle-arrow-muted)"/>
  <path d="M800,80 L800,64 Q800,56 792,56 L672,56 Q664,56 664,64 L664,80" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#slice-lifecycle-arrow-muted)"/>
  <line x1="24" y1="152" x2="816" y2="152" stroke="#4f5d75" stroke-width="1"/>
  <line x1="24" y1="144" x2="24" y2="152" stroke="#4f5d75" stroke-width="1"/>
  <line x1="816" y1="144" x2="816" y2="152" stroke="#4f5d75" stroke-width="1"/>
  <path d="M248,152 L248,196" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#slice-lifecycle-arrow-muted)"/>
  <path d="M296,196 L296,152" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#slice-lifecycle-arrow-muted)"/>
  <path d="M120,152 L120,288" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#slice-lifecycle-arrow-muted)"/>
  <path d="M856,128 L856,288" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#slice-lifecycle-arrow-accent)"/>
  <text x="24" y="20" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="start" letter-spacing="1">PHASES</text>
  <rect x="24" y="80" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1.2"/>
  <text x="88" y="101" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Spec locked</text>
  <text x="88" y="117" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">lead</text>
  <rect x="208" y="80" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1.2"/>
  <text x="272" y="101" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Building</text>
  <text x="272" y="117" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">builder</text>
  <rect x="392" y="80" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1.2"/>
  <text x="456" y="101" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Proof recorded</text>
  <text x="456" y="117" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">QA, r1, r2</text>
  <rect x="576" y="80" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1.2"/>
  <text x="640" y="101" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Judged</text>
  <text x="640" y="117" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">lead</text>
  <rect x="760" y="80" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1.2"/>
  <text x="824" y="101" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Published</text>
  <text x="824" y="117" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">release manager</text>
  <text x="180" y="94" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle" letter-spacing="0.6">ASSIGN</text>
  <text x="364" y="94" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle" letter-spacing="0.6">COMMIT</text>
  <text x="548" y="94" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle" letter-spacing="0.6">PASS</text>
  <text x="732" y="94" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle" letter-spacing="0.6">PUSH</text>
  <text x="364" y="46" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle" letter-spacing="0.6">FINDINGS</text>
  <text x="732" y="46" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle" letter-spacing="0.6">REBASE</text>
  <text x="456" y="144" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle" letter-spacing="0.6">FROM ANY PHASE</text>
  <text x="24" y="184" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="start" letter-spacing="1">HELD</text>
  <rect x="208" y="196" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="272" y="217" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Paused</text>
  <text x="272" y="233" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">rows blocked</text>
  <text x="240" y="178" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="end" letter-spacing="0.6">PAUSE</text>
  <text x="304" y="178" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start" letter-spacing="0.6">RESUME</text>
  <text x="24" y="276" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="start" letter-spacing="1">OUTCOMES</text>
  <rect x="24" y="288" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="88" y="309" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Stopped</text>
  <text x="88" y="325" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">rows closed</text>
  <text x="128" y="178" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start" letter-spacing="0.6">STOP</text>
  <rect x="760" y="288" width="128" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.6"/>
  <text x="824" y="309" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#bf4520" text-anchor="middle">Delivered</text>
  <text x="824" y="325" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">delivery approved</text>
  <text x="848" y="224" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bf4520" text-anchor="end" letter-spacing="0.6">YOU MERGE</text>
  <rect x="0" y="371" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="22" y="380" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#5a6580">the outcome you want</text>
  <rect x="174.0" y="371" width="14" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-dasharray="3,2"/>
  <text x="196.0" y="380" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#5a6580">held, resumable</text>
  <line x1="317.0" y1="376" x2="333.0" y2="376" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="339.0" y="380" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#5a6580">back to an earlier phase</text>
</svg>
