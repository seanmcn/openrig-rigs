<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 456" width="920" height="456" role="img" aria-labelledby="slice-lifecycle-title slice-lifecycle-desc">
  <title id="slice-lifecycle-title">A slice's lifecycle</title>
  <desc id="slice-lifecycle-desc">A slice's spec is locked, then it is built and checked by QA until QA passes, reviewed by a pair, judged and published; findings, a failing CI run and a rebase loop back to building. From any phase you can pause it and resume it, or stop it; it is delivered once you merge.</desc>
  <defs><marker id="slice-lifecycle-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4f5d75"/></marker><marker id="slice-lifecycle-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#bf4520"/></marker></defs>
  <path d="M152,128 L208,128" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#slice-lifecycle-arrow-muted)"/>
  <path d="M336,128 L392,128" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#slice-lifecycle-arrow-muted)"/>
  <path d="M520,128 L576,128" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#slice-lifecycle-arrow-muted)"/>
  <path d="M704,128 L760,128" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#slice-lifecycle-arrow-muted)"/>
  <path d="M432,104 L432,88 Q432,80 424,80 L304,80 Q296,80 296,88 L296,104" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#slice-lifecycle-arrow-muted)"/>
  <path d="M848,104 L848,48 Q848,40 840,40 L256,40 Q248,40 248,48 L248,104" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#slice-lifecycle-arrow-muted)"/>
  <path d="M152,240 L232,240" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#slice-lifecycle-arrow-muted)"/>
  <path d="M232,256 L152,256" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#slice-lifecycle-arrow-muted)"/>
  <path d="M120,272 L120,344" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#slice-lifecycle-arrow-muted)"/>
  <path d="M856,152 L856,344" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#slice-lifecycle-arrow-accent)"/>
  <text x="24" y="20" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="start" letter-spacing="1">PHASES</text>
  <rect x="24" y="104" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1.2"/>
  <text x="88" y="125" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Spec locked</text>
  <text x="88" y="141" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">lead</text>
  <rect x="208" y="104" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1.2"/>
  <text x="272" y="125" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Building</text>
  <text x="272" y="141" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">builder and QA</text>
  <rect x="392" y="104" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1.2"/>
  <text x="456" y="125" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">In review</text>
  <text x="456" y="141" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">a review pair</text>
  <rect x="576" y="104" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1.2"/>
  <text x="640" y="125" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Judged</text>
  <text x="640" y="141" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">lead</text>
  <rect x="760" y="104" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1.2"/>
  <text x="824" y="125" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Published</text>
  <text x="824" y="141" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">release manager</text>
  <text x="180" y="118" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle" letter-spacing="0.6">ASSIGN</text>
  <text x="364" y="118" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle" letter-spacing="0.6">QA PASS</text>
  <text x="548" y="118" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle" letter-spacing="0.6">PASS</text>
  <text x="732" y="118" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle" letter-spacing="0.6">PUSH</text>
  <text x="364" y="70" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle" letter-spacing="0.6">FINDINGS</text>
  <text x="548" y="30" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle" letter-spacing="0.6">CI, REBASE</text>
  <text x="24" y="212" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="start" letter-spacing="1">PAUSE OR STOP</text>
  <rect x="24" y="224" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1.2"/>
  <text x="88" y="245" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Any phase</text>
  <text x="88" y="261" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">of the five above</text>
  <rect x="232" y="224" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="296" y="245" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Paused</text>
  <text x="296" y="261" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">rows blocked</text>
  <text x="192" y="232" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle" letter-spacing="0.6">PAUSE</text>
  <text x="192" y="272" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle" letter-spacing="0.6">RESUME</text>
  <text x="24" y="332" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="start" letter-spacing="1">OUTCOMES</text>
  <rect x="24" y="344" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="88" y="365" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Stopped</text>
  <text x="88" y="381" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">rows closed</text>
  <text x="128" y="312" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start" letter-spacing="0.6">STOP</text>
  <rect x="760" y="344" width="128" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.6"/>
  <text x="824" y="365" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#bf4520" text-anchor="middle">Delivered</text>
  <text x="824" y="381" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5a6580" text-anchor="middle">delivery approved</text>
  <text x="848" y="252" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bf4520" text-anchor="end" letter-spacing="0.6">YOU MERGE</text>
  <rect x="24" y="427" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="46" y="436" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#5a6580">the outcome you want</text>
  <rect x="198.0" y="427" width="14" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-dasharray="3,2"/>
  <text x="220.0" y="436" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#5a6580">held, resumable</text>
  <line x1="341.0" y1="432" x2="357.0" y2="432" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="363.0" y="436" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#5a6580">back to an earlier phase</text>
</svg>
