  <path d="M336,160 L432,160 Q440,160 440,168 L440,216" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#how-a-slice-is-built-dark-arrow-muted)"/>
  <path d="M368,240 L96,240 Q88,240 88,248 L88,296" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#how-a-slice-is-built-dark-arrow-muted)"/>
  <path d="M160,320 L608,320 Q616,320 616,328 L616,376" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#how-a-slice-is-built-dark-arrow-muted)"/>
  <path d="M688,400 L784,400 Q792,400 792,408 L792,456" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#how-a-slice-is-built-dark-arrow-muted)"/>
  <path d="M464,216 L464,156 Q464,148 456,148 L336,148" fill="none" stroke="#bfc0c0" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#how-a-slice-is-built-dark-arrow-muted)"/>
  <path d="M640,376 L640,128 Q640,120 632,120 L296,120 Q288,120 288,128 L288,136" fill="none" stroke="#bfc0c0" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#how-a-slice-is-built-dark-arrow-muted)"/>
  <text x="88" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle" letter-spacing="1">CLERK</text>
  <text x="264" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle" letter-spacing="1">BUILDER</text>
  <text x="440" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle" letter-spacing="1">QA</text>
  <text x="616" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle" letter-spacing="1">REVIEWERS</text>
  <text x="792" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle" letter-spacing="1">LEAD</text>
  <rect x="16" y="56" width="144" height="48" rx="6" fill="rgba(255,255,255,0.05)" stroke="#f5f5f5" stroke-width="1.2"/>
  <text x="88" y="77" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="middle">Assign</text>
  <text x="88" y="93" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle">builder and QA seat</text>
  <rect x="192" y="136" width="144" height="48" rx="6" fill="rgba(255,255,255,0.05)" stroke="#f5f5f5" stroke-width="1.2"/>
  <text x="264" y="157" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="middle">Build</text>
  <text x="264" y="173" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle">commit in a worktree</text>
  <rect x="368" y="216" width="144" height="48" rx="6" fill="rgba(255,255,255,0.05)" stroke="#f5f5f5" stroke-width="1.2"/>
  <text x="440" y="237" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="middle">QA checks</text>
  <text x="440" y="253" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle">at that commit</text>
  <rect x="16" y="296" width="144" height="48" rx="6" fill="rgba(255,255,255,0.05)" stroke="#f5f5f5" stroke-width="1.2"/>
  <text x="88" y="317" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="middle">Name a pair</text>
  <text x="88" y="333" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle">on two runtimes</text>
  <rect x="544" y="376" width="144" height="48" rx="6" fill="rgba(255,255,255,0.05)" stroke="#f5f5f5" stroke-width="1.2"/>
  <text x="616" y="397" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="middle">Review</text>
  <text x="616" y="413" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle">a pair, apart</text>
  <rect x="720" y="456" width="144" height="48" rx="6" fill="rgba(255,255,255,0.05)" stroke="#f5f5f5" stroke-width="1.2"/>
  <text x="792" y="477" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="middle">Compare reviews</text>
  <text x="792" y="493" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle">then judge</text>
  <text x="472" y="203" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="start" letter-spacing="0.6">FAILS</text>
  <text x="648" y="259" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="start" letter-spacing="0.6">FINDINGS</text>
  <text x="360" y="232" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="end" letter-spacing="0.6">PASSES</text>
  <text x="696" y="392" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#bfc0c0" text-anchor="start" letter-spacing="0.6">BOTH PASS</text>
  <line x1="16" y1="544" x2="32" y2="544" stroke="#bfc0c0" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="38" y="548" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#949eb2">back to the builder</text>
</svg>
