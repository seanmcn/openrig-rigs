<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 568" width="880" height="568" role="img" aria-labelledby="how-a-slice-is-built-dark-title how-a-slice-is-built-dark-desc">
  <title id="how-a-slice-is-built-dark-title">How a slice is built</title>
  <desc id="how-a-slice-is-built-dark-desc">The clerk assigns a builder and a QA seat; the builder builds a commit and QA checks it, back to the builder until it passes; the clerk then names a review pair on two runtimes, whose findings go back to the builder and through QA again; once both pass, the lead compares their reviews and judges.</desc>
  <defs><marker id="how-a-slice-is-built-dark-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#bfc0c0"/></marker><marker id="how-a-slice-is-built-dark-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f08a59"/></marker></defs>
  <line x1="176" y1="12" x2="176" y2="520" stroke="rgba(245,245,245,0.16)" stroke-width="1"/>
  <line x1="352" y1="12" x2="352" y2="520" stroke="rgba(245,245,245,0.16)" stroke-width="1"/>
  <line x1="528" y1="12" x2="528" y2="520" stroke="rgba(245,245,245,0.16)" stroke-width="1"/>
  <line x1="704" y1="12" x2="704" y2="520" stroke="rgba(245,245,245,0.16)" stroke-width="1"/>
  <line x1="0" y1="40" x2="880" y2="40" stroke="rgba(245,245,245,0.16)" stroke-width="1"/>
