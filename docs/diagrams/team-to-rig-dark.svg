<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 328" width="720" height="328" role="img" aria-labelledby="team-to-rig-dark-title team-to-rig-dark-desc">
  <title id="team-to-rig-dark-title">From a team to a running rig</title>
  <desc id="team-to-rig-dark-desc">A team's rig.yaml, agent.yaml, start files and skills go into rig bundle install, which starts the rig's seats, each with the skills its profile selects.</desc>
  <defs><marker id="team-to-rig-dark-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#bfc0c0"/></marker><marker id="team-to-rig-dark-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f08a59"/></marker></defs>
  <rect x="24" y="40" width="200" height="280" rx="8" fill="none" stroke="rgba(245,245,245,0.16)" stroke-width="1"/>
  <path d="M208,88 L240,88 Q248,88 248,96 L248,161 Q248,169 256,169 L296,169" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#team-to-rig-dark-arrow-muted)"/>
  <path d="M208,152 L240,152 Q248,152 248,160 L248,171 Q248,179 256,179 L296,179" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#team-to-rig-dark-arrow-muted)"/>
  <path d="M208,216 L240,216 Q248,216 248,208 L248,197 Q248,189 256,189 L296,189" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#team-to-rig-dark-arrow-muted)"/>
  <path d="M208,280 L240,280 Q248,280 248,272 L248,207 Q248,199 256,199 L296,199" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#team-to-rig-dark-arrow-muted)"/>
  <path d="M464,184 L528,184" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#team-to-rig-dark-arrow-accent)"/>
  <text x="24" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="start" letter-spacing="1">rigs/&lt;team&gt;/</text>
  <text x="380" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle" letter-spacing="1">YOU RUN</text>
  <text x="612" y="28" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle" letter-spacing="1">YOUR MACHINE</text>
  <rect x="40" y="64" width="168" height="48" rx="6" fill="rgba(255,255,255,0.05)" stroke="#f5f5f5" stroke-width="1.2"/>
  <text x="124" y="85" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="middle">rig.yaml</text>
  <text x="124" y="101" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle">pods, seats, runtimes</text>
  <rect x="40" y="128" width="168" height="48" rx="6" fill="rgba(255,255,255,0.05)" stroke="#f5f5f5" stroke-width="1.2"/>
  <text x="124" y="149" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="middle">agent.yaml</text>
  <text x="124" y="165" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle">profiles, guidance</text>
  <rect x="40" y="192" width="168" height="48" rx="6" fill="rgba(255,255,255,0.05)" stroke="#f5f5f5" stroke-width="1.2"/>
  <text x="124" y="213" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="middle">Start files</text>
  <text x="124" y="229" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle">culture, settings</text>
  <rect x="40" y="256" width="168" height="48" rx="6" fill="rgba(255,255,255,0.05)" stroke="#f5f5f5" stroke-width="1.2"/>
  <text x="124" y="277" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="middle">Skills</text>
  <text x="124" y="293" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle">skills.md, vendor/</text>
  <rect x="296" y="160.0" width="168" height="48" rx="6" fill="rgba(255,255,255,0.05)" stroke="#f5f5f5" stroke-width="1.2"/>
  <text x="380" y="181" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5" text-anchor="middle">rig bundle install</text>
  <text x="380" y="197" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle">--target, --cwd</text>
  <rect x="528" y="160.0" width="168" height="48" rx="6" fill="rgba(240,138,89,0.12)" stroke="#f08a59" stroke-width="1.6"/>
  <text x="612" y="181" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f08a59" text-anchor="middle">Running rig</text>
  <text x="612" y="197" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#949eb2" text-anchor="middle">a session per seat</text>
</svg>
